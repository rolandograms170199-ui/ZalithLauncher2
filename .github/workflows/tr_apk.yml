name: Compilar APK de T.R Launcher

# Se ejecuta solo: cada vez que subes cambios a la rama principal, o a mano desde la pestaña «Actions» > «Run workflow».
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Instalar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: on-failure

      # Opcional: si creas la variable TR_API_URL (Settings > Secrets and variables > Actions > Variables),
      # se usa como dirección del servidor de cuentas sin tener que editar TrConfig.kt.
      - name: Poner la dirección del servidor de cuentas
        env:
          TR_API_URL: ${{ vars.TR_API_URL }}
        run: |
          if [ -n "$TR_API_URL" ]; then
            sed -i "s|const val API_URL = \".*\"|const val API_URL = \"$TR_API_URL\"|" ZalithLauncher/src/main/java/com/movtery/zalithlauncher/tr/TrConfig.kt
          fi
          grep -n "const val API_URL" ZalithLauncher/src/main/java/com/movtery/zalithlauncher/tr/TrConfig.kt

      - name: Compilar APK (arm64, la mayoría de los celulares)
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleDebug -Darch=arm64 --stacktrace

      - name: Guardar el APK
        uses: actions/upload-artifact@v7
        with:
          name: TR-Launcher-APK
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
